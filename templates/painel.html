    <title>Painel - DBM 2/4</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

    <!-- Barra Superior -->
    <nav class="navbar navbar-dark bg-secondary shadow-sm mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">DBM 2/4 - Sistema de Permutas</span>
            <span class="text-white me-3">Militar: <strong>{{ current_user.graduacao }} {{ current_user.nome }}</strong> {% if current_user.is_admin %}<span class="badge bg-danger ms-2">Escalante</span>{% endif %}</span>

        </div>
    </nav>
