<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Permutas DBM 2/4</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #111; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 350px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0 15px 0; background-color: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #e53935; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #c62828; }
        .flash { color: #fbc02d; margin-bottom: 15px; font-size: 13px; text-align: center; }
        .link { text-align: center; margin-top: 15px; font-size: 13px; }
        .link a { color: #e53935; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="text-align: center; margin-top: 0; color: #e53935;">Novo Cadastro</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">⚠️ {{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form action="/registro" method="POST">
            <label style="font-size: 12px; color: #aaa;">Graduação:</label>
            <select name="graduacao" required>
                <option value="">Selecione...</option>
                <option value="Sd">Sd</option>
                <option value="Cb">Cb</option>
                <option value="3º Sgt">3º Sgt</option>
                <option value="2º Sgt">2º Sgt</option>
                <option value="1º Sgt">1º Sgt</option>
                <option value="Subten">Subten</option>
            </select>
            
            <label style="font-size: 12px; color: #aaa;">Nome Completo:</label>
            <input type="text" name="nome" placeholder="Ex: Carlos Souza" required>
            
            <label style="font-size: 12px; color: #aaa;">RG Militar:</label>
            <input type="text" name="rg" placeholder="Ex: 49.325" required>
            
            <label style="font-size: 12px; color: #aaa;">E-mail Funcional:</label>
            <input type="email" name="email" placeholder="militar@cbmerj.com" required>
            
            <label style="font-size: 12px; color: #aaa;">Senha de Acesso:</label>
            <input type="password" name="senha" placeholder="******" required>
            
            <button type="submit">Cadastrar Solicitação ></button>
        </form>
        <div class="link">
            <a href="/">← Voltar para o Login</a>
        </div>
    </div>
</body>
</html>
