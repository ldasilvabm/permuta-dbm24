
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Permutas DBM 2/4</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0a0a0a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background-color: #111; padding: 30px; border-radius: 8px; border: 1px solid #333; width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0 15px 0; background-color: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #e53935; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #c62828; }
        .flash { color: #fbc02d; margin-bottom: 15px; font-size: 13px; }
        .link { margin-top: 15px; font-size: 13px; }
        .link a { color: #e53935; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/static/brasao.jpeg" width="70" style="margin-bottom: 10px; border-radius: 4px;">
        <h2 style="margin: 0 0 5px 0; color: #e53935;">PERMUTAS</h2>
        <p style="color: #888; font-size: 12px; margin-bottom: 20px;">DBM 2/4 - CBMERJ</p>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="flash">⚠️ {{ messages[0] }}</div>
          {% endif %}
        {% endwith %}

        <form action="/" method="POST">
            <input type="email" name="email" placeholder="E-mail funcional" required>
            <input type="password" name="senha" placeholder="Senha" required>
            <button type="submit">Acessar Painel ></button>
        </form>
        
        <div class="link">
            Não tem uma conta? <a href="/registro">Cadastre-se aqui</a>
        </div>
    </div>
</body>
</html>
